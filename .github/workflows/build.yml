name: Build ChestCounter.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only needed to attach the exe to a release (tags only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Self-test (updater hardening, report details)
        run: dotnet run --project tests/SelfTest -c Release
      - name: Publish
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - name: SHA-256 of the exe
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ChestCounter.exe -Algorithm SHA256).Hash
          "ChestCounter.exe SHA-256: $h" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounter
          path: dist/ChestCounter.exe
      # No third-party action: the GitHub CLI preinstalled on the runner attaches the exe to the release.
      # Older releases are never touched: each tag creates its own release with its own exe.
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = (Get-FileHash dist/ChestCounter.exe -Algorithm SHA256).Hash.ToLower()
          $file = "release-notes/$tag.md"
          $body = if (Test-Path $file) { (Get-Content $file -Raw).TrimEnd() } else { "" }
          $notes = $body + "`n`n---`nSHA-256 of ChestCounter.exe: $sha`n`nOlder versions stay available in the Releases list.`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $tag dist/ChestCounter.exe --repo "${{ github.repository }}" --title "Chest Counter $tag" --notes-file notes.md
